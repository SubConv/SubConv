name: Build and Push Container Image

on:
  workflow_call:
    inputs:
      tags:
        description: 'Tag to use for the image'
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: wouisb/subconv

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tag.outputs.TAG_NAME }}
    steps:
      - id: tag
        env:
          IMAGE_TAGS: ${{ inputs.tags }}
        run: |
          # Expand the caller's comma-separated tags without a leading comma.
          new_tag=""
          IFS="," read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            new_tag="${new_tag:+$new_tag,}${IMAGE_REPOSITORY}:$tag"
          done
          echo "TAG_NAME=$new_tag" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: setup

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Cache Nuitka cache
      uses: actions/cache@v4
      with:
        path: nuitka-cache
        key: nuitka-cache

    - name: Inject Nuitka cache into Docker
      uses: reproducible-containers/buildkit-cache-dance@v2.1.4
      with:
        cache-source: nuitka-cache
        cache-target: /root/.cache/Nuitka

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ needs.setup.outputs.tags }}
        platforms: |
          linux/amd64
          linux/arm64
