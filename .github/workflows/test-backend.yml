name: Test backend

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'subconv/**'
      - 'api.py'
      - 'tests/**'
      - 'template/**'
      - 'config.yaml.example'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-backend.yml'
  pull_request:
    paths:
      - 'subconv/**'
      - 'api.py'
      - 'tests/**'
      - 'template/**'
      - 'config.yaml.example'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --group test
      - name: Check Python sources
        run: uv run --no-sync python -m compileall -q subconv api.py
      - name: Test backend
        run: uv run --no-sync python -m pytest tests/ -q
